# Spotster — één service: SvelteKit UI + game WebSocket (/ws)
# Dashboard: New Project → Deploy from GitHub → NickRainger/spotster

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
